  .card:hover { background: #282c33; transform: translateX(3px); }
  .card .name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .card .barrio { color: #8a8f99; font-size: 12px; margin-bottom: 6px; }
  .card .tag { display:inline-block; background:#2d323a; border-radius:4px; padding:1px 6px; font-size: 10.5px; margin: 2px 3px 2px 0; color:#b8bcc4;}
  .card .price { color: #2ecc71; font-weight:600; font-size:12px;}
  .card .notas { color: #e8e8e8; font-size: 11.5px; margin-top: 6px; line-height: 1.45; }
  .card .reserva { color:#f1c40f; font-size:11px; margin-top:4px; }
  .empty { color: #8a8f99; font-size: 13px; padding: 20px 4px; text-align: center; }

  .legend { position:absolute; bottom:20px; left:20px; background:rgba(20,22,26,.92); color:#e8e8e8; padding:10px 12px; border-radius:8px; font-size:11.5px; z-index:1000; line-height:1.7;}
  .legend b { font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle;}

  /* --- Móvil: apilar mapa arriba, panel abajo --- */
  @media (max-width: 820px) {
    body { flex-direction: column; }
    #map { flex: none; height: 48dvh; height: 48vh; width: 100%; }

const MOMENTO = [

  {key:"atraccion", label:"📍 Atracciones", color:"#2c3e50"}
];
const COLOR_ATRACCION = "#2c3e50";
// Construye una lista unificada con un flag de capa ("comida" | "atraccion").
const TODOS = lugares.map(l => ({...l, capa:"comida"}))
  .concat(atracciones.map(a => ({...a, capa:"atraccion"})));

// Un lugar "matchea" una key si la tiene en cat, o si tiene una variante equivalente.
const EQUIV = {
  almuerzo: ["almuerzo","fin_de_semana_almuerzo"],
  liviano:  ["liviano","almuerzo_liviano"],
  merienda: ["merienda","brunch"]
};
function matchea(l, key) {
  const ks = EQUIV[key] || [key];
  return ks.some(k => l.cat.includes(k));
}
function colorDe(cats) { for (let c of cats) if (COLORES[c]) return COLORES[c]; return '#888'; }

const map = L.map('map').setView([-34.58, -58.44], 14);
const TILES = [
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: 'Esri &copy; OpenStreetMap contributors', max: 19 },
  { url: 'https://a.tile.opentopomap.org/{z}/{x}/{y}.png', attr: '&copy; OpenTopoMap (CC-BY-SA)', max: 17 },
  { url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr: '&copy; OpenStreetMap contributors', max: 19 }
];
let idx = 0;
function addTiles() {
  const t = TILES[idx];
  const layer = L.tileLayer(t.url, { attribution: t.attr, maxZoom: t.max, crossOrigin: true }).addTo(map);
  let errs = 0;
  layer.on('tileerror', () => {
    if (++errs === 1 && idx < TILES.length - 1) { map.removeLayer(layer); idx++; addTiles(); }
  });
}
addTiles();
setTimeout(() => map.invalidateSize(), 200);

const MARKER_HTML = (col, ico, dim) =>
  `<div style="background:${col};width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:${dim?0.22:1};transition:opacity .2s;"><span style="transform:rotate(45deg);font-size:14px;">${ico}</span></div>`;

const markers = {};

  const col = l.capa === "atraccion" ? COLOR_ATRACCION : colorDe(l.cat);

// --- Estado de filtros: arrays de keys activas por grupo ---
const activos = { cat: new Set(), momento: new Set(), plan: new Set() };
const cards = document.getElementById('cards');
const contador = document.getElementById('contador');

function pasar(l) {
  // capa: comida vs atraccion. Si no hay categoría activa, se ve todo.
  const okC = activos.cat.size === 0 || activos.cat.has(l.capa);
  // momento solo aplica a gastronomía (las atracciones traen su propio campo `momento`).
  let okM = true;
  if (l.capa === "comida") {
    okM = activos.momento.size === 0 || [...activos.momento].some(k => matchea(l, k));
  }
  const okP = activos.plan.size === 0 || (l.capa === "comida" && [...activos.plan].some(k => matchea(l, k)));
  return okC && okM && okP;
}

function render() {
  // limpiar cards
  cards.innerHTML = '';
  let n = 0;
  TODOS.forEach(l => {
    const visible = pasar(l);
    // marcador: atenuar los que no pasan (no los ocultamos para no perder contexto del mapa)
    markers[l.id].marker.setIcon(L.divIcon({ className: '', html: MARKER_HTML(markers[l.id].col, l.icono, !visible),
      iconSize: [30,30], iconAnchor: [15,30], popupAnchor: [0,-30] }));
    markers[l.id].marker.setZIndexOffset(visible ? 0 : -1000);
    if (!visible) return;
    n++;
    const catTags = l.cat.map(c => `<span class="tag">${c.replace(/_/g,' ')}</span>`).join('');
    const horario = l.horario ? `<div class="reserva">🕐 ${l.horario}</div>` : '';
    const d = document.createElement('div');
    d.className = 'card'; d.style.borderLeftColor = markers[l.id].col;
    d.innerHTML = `<div class="name">${l.icono} ${l.nombre}</div>
      <div class="barrio">${l.barrio} · ${l.dir}</div>${catTags} <span class="price">${l.precio}</span>
      <div class="notas">${l.notas}</div><div class="reserva">📅 ${l.reserva}</div>${horario}`;
    d.onclick = () => {
      const movil = window.innerWidth <= 820;
      const z = movil ? 15 : 17;
      const target = movil ? map.project([l.lat, l.lon], z).add([0, 90]) : [l.lat, l.lon];
      const center = movil ? map.unproject(target, z) : target;
      map.flyTo(center, z, {duration: 0.8});
      markers[l.id].marker.openPopup();
    };
    cards.appendChild(d);
  });
  if (n === 0) cards.innerHTML = '<div class="empty">Sin resultados con esos filtros 🤷</div>';
  contador.textContent = n;
}

// --- Construcción de chips ---
function buildChips(cont, items, grupo) {
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'chip off';
    el.style.setProperty('--c', it.color);
    el.dataset.key = it.key;
    el.innerHTML = `${it.label}<span class="cnt"></span>`;
    el.onclick = () => {
      const s = activos[grupo];
      if (s.has(it.key)) s.delete(it.key); else s.add(it.key);
      syncChips();
      render();
    };
    cont.appendChild(el);
  });
}
function syncChips() {
  for (const g of ['cat','momento','plan']) {
    document.querySelectorAll('#filtro-'+g+' .chip').forEach(c => {
      const on = activos[g].has(c.dataset.key);
      c.classList.toggle('on', on); c.classList.toggle('off', !on);
      c.style.background = on ? c.style.getPropertyValue('--c') : '';
    });
  }
  // contadores (cuántos elementos pasan con SOLO esa key del grupo)
  document.querySelectorAll('#filtro-cat .chip').forEach(c => {
    c.querySelector('.cnt').textContent = TODOS.filter(l => l.capa === c.dataset.key).length;
  });
  document.querySelectorAll('#filtro-momento .chip').forEach(c => {
    c.querySelector('.cnt').textContent = lugares.filter(l => matchea(l, c.dataset.key)).length;
  });
  document.querySelectorAll('#filtro-plan .chip').forEach(c => {
    c.querySelector('.cnt').textContent = lugares.filter(l => matchea(l, c.dataset.key)).length;
  });
}

buildChips(document.getElementById('filtro-cat'), CATEGORIA, 'cat');
buildChips(document.getElementById('filtro-momento'), MOMENTO, 'momento');
buildChips(document.getElementById('filtro-plan'), PLAN, 'plan');
document.getElementById('reset').onclick = () => { activos.cat.clear(); activos.momento.clear(); activos.plan.clear(); syncChips(); render(); };

syncChips();
render();
</script>
