name: Tablero ROS

on:
  schedule:
    # Cron en UTC. Argentina es UTC-3.
    # 03:00 UTC = 00:00 ART  /  15:00 UTC = 12:00 ART
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablero-ros
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr script
        run: python test.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commitear estado actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear"
          else
            git commit -m "Corrida automática $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
